<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Онлайн Трансляция</title>
    <link rel="stylesheet" href="stream.css" />
    <script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.min.js"></script>
  </head>
  <body>
    <div class="main">
      <div class="player-container">
        <div class="header-row">
          <div class="header-row__left">
            <h1>Стримы Сапушки</h1>
            <span class="badge-live">LIVE</span>
            <span id="stream-status"></span>
          </div>
          <div class="header-row__links">
            <a href="https://sapushka.oda.digital/">💰 На поддержку сервера</a>
            <a href="https://sapushka.oda.digital/">🍖 Торну на еду</a>
          </div>
        </div>

        <div class="video-wrapper">
          <video id="video" controls autoplay muted playsinline></video>
        </div>
      </div>
    </div>

    <div class="chat-sidebar">
      <div class="chat-tabs" role="tablist">
        <button class="chat-tab active" data-chat="twitch" type="button">
          Twitch
        </button>
        <button class="chat-tab" data-chat="vk" type="button">VK Video</button>
      </div>
      <div class="chat-panel">
        <iframe
          data-chat-panel="twitch"
          src="https://www.twitch.tv/embed/sapushka_/chat?parent=sapa-tv.ru&amp;darkpopout"
          allowfullscreen
          sandbox="allow-modals allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms"
        ></iframe>
        <iframe
          data-chat-panel="vk"
          src="https://live.vkvideo.ru/sapushka_/stream/default/only-chat"
          allowfullscreen
          sandbox="allow-modals allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms"
        ></iframe>
      </div>
    </div>

    <script src="stream.js"></script>
  </body>
</html>
